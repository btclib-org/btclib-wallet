# The partially signed transaction, mutated: the three maps, the key-value
# codecs under them, the size estimate a fee rate is applied to, and the
# MuSig2 and FROST fields a signing session is carried in. A psbt is a
# format two programs exchange, so its boundaries are somebody else's input
# in the sense issue btclib-org/btclib#327 means -- an unknown field kept or
# dropped, a required one missing, a duplicate key, a map ending where the
# next one begins -- and the vectors that judge it are BIP174's, BIP370's,
# BIP371's and BIP373's own, with BIP445's group for the FROST fields.
# This asks whether the suite would notice a wrong line.

[cosmic-ray]
# `musig2.py` and `frost.py` are here too: btclib's musig2.toml and
# frost.toml mutate `ecc/musig2.py` and `ecc/frost.py`, the schemes these
# carry sessions of, and this tree holds only the psbt half.
# tests/psbt/musig2_test.py and tests/psbt/frost_test.py run under the
# command below
module-path = [
    "src/btclib_wallet/psbt/frost.py",
    "src/btclib_wallet/psbt/musig2.py",
    "src/btclib_wallet/psbt/psbt.py",
    "src/btclib_wallet/psbt/psbt_in.py",
    "src/btclib_wallet/psbt/psbt_out.py",
    "src/btclib_wallet/psbt/psbt_utils.py",
    "src/btclib_wallet/psbt/psbt_size.py",
    "src/btclib_wallet/psbt/__init__.py",
]

# tests/psbt, and the three convention files at the top of tests/ that
# reach lines of these modules tests/psbt does not -- measured with
# `--cov=btclib_wallet.psbt --cov-branch` over this command, which leaves
# one line and one branch. The line is `psbt_utils`' refusal of an empty
# PSBT_IN_TAP_LEAF_SCRIPT value, a record with no room for the leaf
# version it must end with, which only tests/fuzz_test.py reaches:
# hypothesis draws that input rather than a vector file holding it, and a
# `@given` draws fresh bytes on each run, so its verdict is not
# reproducible and the value of a weekly report is the comparison with the
# week before. The branch is `psbt.py`'s p2tr input with no internal key,
# which tests/descriptors reaches, and that directory is
# descriptors.toml's to run. The mutants of both are expected survivors
test-command = """python -m pytest -x -q -n0 -p no:randomly tests/psbt \
  tests/built_object_contract_test.py tests/integer_policy_test.py \
  tests/serialization_boundary_test.py"""

# seconds of wall clock, wide for the reason btclib's sig_hash.toml measures,
# and with somewhere to hide here: `psbt_utils.deserialize_map` reads key-value
# records in a `while True` until the 0x00 separator, so a mutated end condition
# is a read that never stops rather than a wrong answer
timeout = 300

excluded-modules = []

# the `BitOr` exclusion btclib's parsers.toml argues, and the one scope here
# where it costs something rather than nothing, which is why the
# price is checked here rather than assumed. Most of the `|` mutants
# are annotations:
#
#   grep -n ' | ' \
#       src/btclib_wallet/psbt/frost.py \
#       src/btclib_wallet/psbt/musig2.py \
#       src/btclib_wallet/psbt/psbt.py \
#       src/btclib_wallet/psbt/psbt_in.py \
#       src/btclib_wallet/psbt/psbt_out.py \
#       src/btclib_wallet/psbt/psbt_utils.py \
#       src/btclib_wallet/psbt/psbt_size.py \
#       src/btclib_wallet/psbt/__init__.py
#
# Two lines are not: `_tx_modifiable`'s `INPUTS_MODIFIABLE |
# OUTPUTS_MODIFIABLE` and the mask that combines two flag bytes below
# it. The unfiltered session says what skipping them loses: every
# BitOr mutant on those two lines it killed, a `combine` test already
# answers, and the one it did not kill -- `|` for `+` over two
# disjoint bits -- is equivalent. So the exclusion gives up nothing a
# test does not already cover, and takes a whole list of unkillable
# survivors out of one somebody has to read
[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]

# A sample, read off the `psbt-survivors.txt` the workflow uploads,
# at btclib's run 34833390559, the per-mutant cost here multiplied by other
# profiles sharing the machine.
#
# The gaps, and the ones a test now answers -- each measured surviving
# before its test and dying after, one mutant at a time:
#
# - every lock-time bound had a side nothing asked for. BIP370's three
#   fields are now asserted at the value each admits as well as the one
#   it refuses: `fallback_lock_time` at 0 and 0xFFFFFFFF and refusing -1,
#   `required_time_lock_time` at 0xFFFFFFFF and refusing the second after
#   it, `required_height_lock_time` at 1 and refusing 0 -- which is the
#   one value BIP65 gives a meaning of its own, nLockTime's "no lock time
#   at all".
# - `0 <= tx_modifiable <= 0xFF` weakened to `0 != tx_modifiable`
#   accepted a negative flag byte: no flag set is now asserted valid,
#   being a psbt nobody may modify rather than an invalid one.
# - `combine`'s `other_id != tx_id` weakened to `>` was tested with the
#   ids in one arrangement only; the same disagreement combined the other
#   way round closes it -- the shape fetch.toml closed for `tx.id`.
# - `_assert_new_taproot_sigs_verify`'s `sig[:64]` widened to `sig[:65]`
#   is equivalent for a 64-byte signature -- slicing past the end is not
#   an error -- and differs only for the 65-byte shape, where the last
#   byte is a sighash type that must not be verified as part of the
#   signature. Both of its paths are now signed with an explicit type,
#   and the answer run through `assert_signatures_only`. The script path
#   needed a signer to produce one at all, which `sign` gained for this
#   (btclib-org/btclib#560): the only other source of a script path
#   signature here is a
#   BIP373 MuSig2 aggregation, and those partial signatures commit to
#   SIGHASH_DEFAULT. The key path mutant beside it is the same hole, and
#   is among the part of the scope this session never ran.
#
# What is left open has a reason rather than a test owed:
#
# - `parse_taproot_bip32`'s `len_ * LEAF_HASH_SIZE + FINGERPRINT_SIZE`
#   with `^` for `+` is equivalent by arithmetic: `32 * len_` is a
#   multiple of 32, so bit 2 is clear and `^ 4` is `+ 4` for every count.
# - `assert_signatures_only`'s `zip(..., strict=True)` turned False needs
#   a returned psbt with a different number of outputs, and the whole
#   transaction is compared before the walk is reached: measured, a
#   dropped output and a dropped input each answer "the transaction being
#   signed was changed" first.
#
# The remaining classes are the ones documented elsewhere here: a
# `check_validity` default, an `is` over interned ints, and a comparison
# against a value at the extreme of its closed set.

# one mutant at a time, in this working tree: see btclib's sig_hash.toml
[cosmic-ray.distributor]
name = "local"
