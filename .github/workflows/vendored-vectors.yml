---
name: vendored vectors

# tests/_data/README.md pins every vendored test vector to a commit and a
# git blob SHA-1, and carries a documented manual procedure to re-check
# one pin. This runs that procedure once a week instead, over every pin
# the script can check, and opens or updates an issue on drift rather than
# fixing anything: what to do about a pin that has moved is a decision the
# script does not get to make.
#
# The checkout, the optional interpreter setup and the re-check itself are
# btclib-org/.github's: reusable-vendored-vectors.yml, called at @main
# (section 10 of its README.md), running this tree's
# .github/scripts/check_vendored_vectors.py. What stays here is the
# trigger, the schedule, the concurrency group and the ledger this tree
# checks.
#
# issues: write is granted here and by no other workflow in this tree; the
# reason is the called workflow's own header, not this file's to restate.

on:
  schedule:
    # section 10's calendar in btclib-org/.github, and not this file's to
    # restate
    - cron: "40 3 * * 1"
  workflow_dispatch:
  # a change to the script, to the ledger or to this file is checked by the
  # run they configure
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition withheld; closed, so that a close lands in this pull
    # request's own group, where a merge queues behind the run in flight
    # rather than cancelling it (the group below)
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/vendored-vectors.yml
      - .github/scripts/check_vendored_vectors.py
      - tests/_data/README.md

permissions:
  contents: read

# keyed on the pull request's own number where there is one, so a
# scheduled or dispatched run keeps a group of its own. No push trigger,
# so a merged pull request's run is the only reading the merged file gets:
# that run queues behind the one in flight rather than cancelling it
concurrency:
  group: vendored-vectors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  vectors:
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    uses: btclib-org/.github/.github/workflows/reusable-vendored-vectors.yml@main
    # a caller's permissions: block bounds the called workflow and refuses
    # rather than trims, so its job's scopes are named here
    permissions:
      contents: read
      issues: write # gh issue create/edit/close, in the called workflow
    with:
      ledgers: >-
        [{"ledger": "tests/_data/README.md",
        "title": "Vendored vectors behind upstream"}]
      # the interpreter the script runs on, which reads no lock
      python-version: "3.14"
