---
name: pypi-install

# the sentinel on what users actually install. Every other workflow here
# tests artifacts built in the same run, from the tree that triggered it:
# nothing else says whether the wheel already on PyPI still installs, with
# the btclib and bitcoin-core-rpc the index serves beside it, and still
# works. What breaks it is not a change in this repository -- a new runner
# image, a new interpreter, a sibling's release, a yanked dependency -- so
# it runs on a schedule rather than on a pull request.
#
# The check derives an address from a mnemonic, which opens a word list
# the wheel carries: an import runs `__init__.py` alone, where a data file
# missing from the wheel is opened only at the first call that needs it

on:
  # called by release.yml once PyPI has accepted the upload, with the tag,
  # so the wait below holds until the index serves that version; the
  # schedule and a dispatch pass none and install whatever the index serves
  workflow_call:
    inputs:
      version:
        description: >-
          the tag whose version the index must serve before the matrix
          installs anything, empty on a run with no release behind it
        required: false
        type: string
        default: ""
  schedule:
    # section 10's calendar in btclib-org/.github, and not this file's to
    # restate
    - cron: "40 5 * * 3"
  workflow_dispatch:
  # so a change to this file is checked by the run it configures. No
  # closed type, for the reason section 10 of the organization's standard
  # gives a group that does not cancel in progress: a closed event would
  # cancel nothing and only start a run
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/pypi-install.yml

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, pip) can read the token, so it must not be able to write to
# the repository
permissions:
  contents: read

# never cancel a sentinel: the run a release calls, the weekly one and a
# dispatch share this group, each is a sample worth keeping, and none
# supersedes the others. A concurrent run queues instead
concurrency:
  group: pypi-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # one question about the index, asked once, ahead of every cell: a cell
  # that starts before the index serves the new file tests the previous
  # version and reports a pass for it. The wait is btclib-org/.github's
  # reusable-wait-for-index.yml, called at @main
  wait-for-index:
    if: ${{ !github.event.pull_request.draft }}
    uses: btclib-org/.github/.github/workflows/reusable-wait-for-index.yml@main
    with:
      package: btclib-wallet
      version: ${{ inputs.version }}

  install-published:
    name: >-
      ${{ matrix.no-binary && 'Build' || 'Install' }}
      ${{ matrix.python-version }} from PyPI on ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    needs: wait-for-index
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # every image the platform sweeps run, at the floor, the ceiling
        # and the free-threaded build of the ceiling
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
        python-version: ["3.11", "3.14", "3.14t"]
        # and one cell that builds the sdist rather than taking the wheel,
        # which is the other half of what the index serves
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            no-binary: true
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the published package
        shell: bash
        env:
          NO_BINARY: ${{ matrix.no-binary || false }}
        run: |
          python -m pip install -U pip
          if [ "$NO_BINARY" = "true" ]; then
            python -m pip install --verbose --no-binary btclib-wallet btclib-wallet
          else
            python -m pip install --verbose --only-binary btclib-wallet btclib-wallet
          fi
      - name: Derive BIP84's first address from its mnemonic
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import requires, version
          from btclib_wallet import bip44
          from btclib_wallet.mnemonic import bip39

          print("installed version:", version("btclib-wallet"))
          print("requires:", requires("btclib-wallet"))
          xprv = bip39.mxprv_from_mnemonic("abandon " * 11 + "about")
          address = bip44.address_from_der_path(xprv, "m/84h/0h/0h/0/0")
          assert address == "bc1qcr8te4kr609gcawutmrza0j4xv80jy8z306fyu", address
          print("ok")
          PY
