---
name: Feature request
description: Add something to btclib-wallet, or change how it works
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: >
        btclib-wallet is what takes a seed to a signed, broadcast
        transaction, and every module with a counterparty outside the
        process: a device, a node, a server, a file from another wallet.
        An encoding, a consensus rule or a signature scheme belongs in
        [btclib](https://github.com/btclib-org/btclib/issues) instead.

  - type: textarea
    id: what
    attributes:
      label: What is missing
      description: >
        What it would let a caller do, and how the call would read.
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: Specification
      description: >
        The BIP, RFC, or reference implementation that defines it. What has
        no specification has no test vectors either, which is the harder
        half of adding it.
      placeholder: "BIP174, https://github.com/bitcoin/bips/blob/master/bip-0174.mediawiki"

  - type: textarea
    id: why
    attributes:
      label: Why it belongs in btclib-wallet
      description: >
        What cannot be done today with what the package already exposes.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other spellings of the same feature, and what an existing caller
        would have to change if this were added.
